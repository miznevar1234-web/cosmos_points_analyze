<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>點數兌換效期分析</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #181c27;
    --surface2: #1e2333;
    --border: #2a3048;
    --accent: #4ade80;
    --accent2: #22d3ee;
    --danger: #f87171;
    --warn: #fbbf24;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #475569;
    --green-dim: #052e16;
    --red-dim: #2d0a0a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(74,222,128,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(74,222,128,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 24px;
    position: relative;
    z-index: 1;
  }

  .header {
    display: flex;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 40px;
  }
  .header-icon {
    width: 52px; height: 52px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
    box-shadow: 0 0 24px rgba(74,222,128,0.3);
  }
  .header-text h1 {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .header-text p {
    font-size: 13px;
    color: var(--text2);
    margin-top: 4px;
    line-height: 1.5;
  }

  /* Upload grid */
  .upload-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 32px;
  }
  @media (max-width: 640px) { .upload-grid { grid-template-columns: 1fr; } }

  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: 16px;
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: rgba(74,222,128,0.05);
    box-shadow: 0 0 32px rgba(74,222,128,0.1);
  }
  .upload-zone.loaded {
    border-color: var(--accent);
    background: rgba(74,222,128,0.04);
  }
  .upload-zone.optional {
    border-color: var(--accent2);
    opacity: 0.85;
  }
  .upload-zone.optional:hover, .upload-zone.optional.drag-over {
    border-color: var(--accent2);
    background: rgba(34,211,238,0.05);
    box-shadow: 0 0 32px rgba(34,211,238,0.1);
    opacity: 1;
  }
  .upload-zone.optional.loaded {
    border-color: var(--accent2);
    background: rgba(34,211,238,0.04);
    opacity: 1;
  }
  .upload-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
  }
  .upload-icon { font-size: 32px; margin-bottom: 10px; }
  .upload-zone h3 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .upload-zone p { font-size: 12px; color: var(--text2); }
  .upload-tag {
    display: inline-block;
    margin-bottom: 8px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .upload-tag.required { background: rgba(74,222,128,0.15); color: var(--accent); }
  .upload-tag.optional  { background: rgba(34,211,238,0.15); color: var(--accent2); }

  /* Alert banner for missing refunds */
  .alert-banner {
    display: none;
    background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.3);
    border-left: 4px solid var(--danger);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 20px;
  }
  .alert-banner.show { display: block; }
  .alert-banner-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--danger);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .alert-row {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid rgba(248,113,113,0.1);
    font-size: 12px;
  }
  .alert-row:last-child { border-bottom: none; }
  .alert-date { font-family: 'DM Mono', monospace; color: var(--text2); min-width: 90px; }
  .alert-name { flex: 1; color: var(--text); }
  .alert-pts { font-family: 'DM Mono', monospace; font-weight: 700; color: var(--danger); min-width: 60px; text-align: right; }
  .alert-total {
    margin-top: 10px;
    font-size: 12px;
    color: var(--danger);
    font-weight: 700;
    text-align: right;
    font-family: 'DM Mono', monospace;
  }

  /* Stats bar */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  @media (max-width: 640px) { .stats-bar { grid-template-columns: repeat(2, 1fr); } }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
  }
  .stat-card .val {
    font-size: 26px;
    font-weight: 700;
    font-family: 'DM Mono', monospace;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-card .lbl { font-size: 11px; color: var(--text2); margin-top: 4px; }

  /* Filter bar */
  .filter-bar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-bar input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 14px;
    font-size: 13px;
    font-family: 'Noto Sans TC', sans-serif;
    outline: none;
    flex: 1;
    min-width: 180px;
    transition: border-color 0.2s;
  }
  .filter-bar input:focus { border-color: var(--accent2); }
  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text2);
    padding: 8px 14px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(74,222,128,0.05);
  }
  .filter-btn.danger-btn:hover, .filter-btn.danger-btn.active {
    border-color: var(--danger);
    color: var(--danger);
    background: rgba(248,113,113,0.08);
  }
  .export-btn {
    background: var(--surface2);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .export-btn:hover { background: rgba(74,222,128,0.1); }

  .results-wrap { display: none; }
  .results-wrap.show { display: block; }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }

  /* Flat card */
  .flat-card {
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 10px;
    background: var(--surface);
    transition: box-shadow 0.2s;
  }
  .flat-card:hover { box-shadow: 0 2px 16px rgba(0,0,0,0.3); }
  .flat-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .flat-date { font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }
  .flat-label { font-size: 11px; }
  .flat-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 10px;
    line-height: 1.4;
  }
  .flat-total { font-size: 12px; font-weight: 400; color: var(--text2); margin-left: 6px; }
  .flat-rows { display: flex; flex-direction: column; gap: 6px; }
  .flat-row { display: flex; align-items: center; gap: 10px; }
  .flat-pts { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 600; min-width: 60px; }
  .flat-expiry { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text2); flex: 1; }
  .flat-badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    font-weight: 500;
    white-space: nowrap;
  }

  .id-tag {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: var(--text2);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 2px 8px;
    border-radius: 4px;
    white-space: nowrap;
    margin-left: auto;
  }

  /* Leaking card special style */
  .flat-card.leaking {
    border-left-color: var(--danger);
    background: rgba(248,113,113,0.03);
  }
  .leaking-tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 4px;
    background: rgba(248,113,113,0.15);
    color: var(--danger);
    font-weight: 700;
    margin-right: 6px;
  }

  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--surface2);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    z-index: 999;
    transform: translateY(80px);
    opacity: 0;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  .clear-btn {
    display: none;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text3);
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.15s;
    white-space: nowrap;
    margin-left: auto;
  }
  .clear-btn:hover {
    border-color: var(--danger);
    color: var(--danger);
    background: rgba(248,113,113,0.06);
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-icon">💎</div>
    <div class="header-text">
      <h1>點數兌換效期分析工具</h1>
      <p>匯入點數紀錄 + 商品／票券兌換記錄，自動以 FIFO 分析效期組成，並比對漏退點數</p>
    </div>
    <button class="clear-btn" id="clearBtn" onclick="clearAll()">🗑 清除資料</button>
  </div>

  <!-- Upload grid: 兩個上傳區 -->
  <div class="upload-grid">
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="fileInput" accept=".xlsx,.xls,.csv">
      <div class="upload-icon">📂</div>
      <div class="upload-tag required">必要</div>
      <h3>點數紀錄</h3>
      <p>含兌換扣點／退回／積點等流水記錄</p>
    </div>
    <div class="upload-zone optional" id="uploadZone2">
      <input type="file" id="fileInput2" accept=".xlsx,.xls,.csv">
      <div class="upload-icon">🗂️</div>
      <div class="upload-tag optional">選擇性（可多次上傳）</div>
      <h3>商品訂單 ＋ 票券紀錄</h3>
      <p>用於比對漏退點數，支援分批上傳</p>
    </div>
  </div>

  <!-- 漏退警示 -->
  <div class="alert-banner" id="alertBanner">
    <div class="alert-banner-title">⚠️ 偵測到漏退點數（後台已取消，但點數記錄無退回）</div>
    <div id="alertRows"></div>
    <div class="alert-total" id="alertTotal"></div>
  </div>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar" style="display:none">
    <div class="stat-card"><div class="val" id="sTotalRedeem">0</div><div class="lbl">兌換筆數</div></div>
    <div class="stat-card"><div class="val" id="sTotalPts">0</div><div class="lbl">總兌換點數</div></div>
    <div class="stat-card"><div class="val" id="sExpiredPts" style="background:linear-gradient(135deg,var(--danger),#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent">0</div><div class="lbl">含過期點數筆數</div></div>
    <div class="stat-card"><div class="val" id="sLeaking" style="background:linear-gradient(135deg,var(--danger),var(--warn));-webkit-background-clip:text;-webkit-text-fill-color:transparent">-</div><div class="lbl">漏退點數筆數</div></div>
  </div>

  <!-- Filter -->
  <div class="filter-bar" id="filterBar" style="display:none">
    <input type="text" id="searchInput" placeholder="🔍 搜尋商品名稱…" oninput="renderResults()">
    <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">全部</button>
    <button class="filter-btn" id="filterExpired" onclick="setFilter('expired')">含過期點數</button>
    <button class="filter-btn" id="filterValid" onclick="setFilter('valid')">全部有效</button>
    <button class="filter-btn" id="filterCompleted" onclick="setFilter('completed')">✅ 已完成兌換</button>
    <button class="filter-btn" id="filterCancelled" onclick="setFilter('cancelled')">↩ 已取消兌換</button>
    <button class="filter-btn danger-btn" id="filterLeaking" onclick="setFilter('leaking')" style="display:none">⚠ 漏退點數</button>
    <button class="export-btn" onclick="exportExcel()">⬇ 匯出 Excel</button>
  </div>

  <!-- Results -->
  <div class="results-wrap" id="resultsWrap">
    <div id="resultsList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let analysisData = [];
let currentFilter = 'all';
let fileData = null;
let columnMap = {};
const TODAY = new Date();

// 後台已取消的訂單（商品＋票券合併）
// 格式：{ name, date(Date), pts, source }
let backendCancelledOrders = [];

// 票券序號 / 訂單編號索引，key = 「商品名稱|兌換時間(分鐘)」
// 兌換扣點發生時間與 vou/md 檔的「兌換時間」精準對到分鐘，可直接配對
let voucherIndex = new Map();   // -> { serial, ticketId, status, useStatus, useTime }
let orderIndexMap = new Map();  // -> { orderId, status }

function timeKey(dt) {
  if (!dt) return '';
  const p = n => String(n).padStart(2, '0');
  return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())} ${p(dt.getHours())}:${p(dt.getMinutes())}`;
}

// ── Upload: 點數記錄（必要）──────────────────────────────
const fileInput = document.getElementById('fileInput');
const uploadZone = document.getElementById('uploadZone');
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
uploadZone.addEventListener('drop', e => { e.preventDefault(); uploadZone.classList.remove('drag-over'); handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e => handleFile(e.target.files[0]));

function handleFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type: 'binary', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
    if (rows.length < 2) { showToast('❌ 檔案內容為空'); return; }
    fileData = rows;
    uploadZone.querySelector('h3').textContent = `✅ ${file.name}`;
    uploadZone.classList.add('loaded');
    runAnalysis();
  };
  reader.readAsBinaryString(file);
}

// ── Upload: 商品訂單 + 票券（選擇性，可多次上傳）─────────
const fileInput2 = document.getElementById('fileInput2');
const uploadZone2 = document.getElementById('uploadZone2');
uploadZone2.addEventListener('dragover', e => { e.preventDefault(); uploadZone2.classList.add('drag-over'); });
uploadZone2.addEventListener('dragleave', () => uploadZone2.classList.remove('drag-over'));
uploadZone2.addEventListener('drop', e => { e.preventDefault(); uploadZone2.classList.remove('drag-over'); handleFile2(e.dataTransfer.files[0]); });
fileInput2.addEventListener('change', e => handleFile2(e.target.files[0]));

function handleFile2(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type: 'binary', cellDates: true });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
    if (rows.length < 2) { showToast('❌ 檔案內容為空'); return; }

    const headers = rows[0].map(h => String(h || '').trim());

    // 自動偵測是商品訂單 or 票券記錄
    const isVoucher = headers.some(h => h.includes('票券'));
    const isMd = headers.some(h => h.includes('訂單編號') || h.includes('處理狀態'));

    let added = 0;
    let indexed = 0;
    if (isVoucher) {
      // 票券欄位：票券序號=1, 票券名稱=2, 票券ID=3, 兌換點數=4, 票券狀態=5,
      //           類別=6, 使用狀態=7, 兌換時間=8, 使用時間=9, 使用館別=10, 使用廳別=11
      for (const row of rows.slice(1)) {
        const serial = String(row[1] || '').trim();
        const name = String(row[2] || '').trim();
        const ticketId = String(row[3] || '').trim();
        const pts  = Number(row[4]) || 0;
        const status = String(row[5] || '').trim();
        const useStatus = String(row[7] || '').trim();
        const timeVal = row[8];
        if (!name || pts <= 0) continue;
        const dt = parseDate(timeVal);
        if (!dt) continue;

        // 建立序號索引，供結果卡片顯示與匯出使用（不限已取消）
        voucherIndex.set(name + '|' + timeKey(dt), {
          serial, ticketId, status, useStatus, useTime: parseDate(row[9])
        });
        indexed++;

        if (status === '已取消') {
          const dup = backendCancelledOrders.find(o => o.name === name && Math.abs(o.date - dt) < 60000 && o.pts === pts);
          if (!dup) { backendCancelledOrders.push({ name, date: dt, pts, source: '票券', serial }); added++; }
        }
      }
      showToast(`✅ 票券記錄已載入（索引 ${indexed} 筆序號，新增 ${added} 筆已取消）`);
    } else if (isMd) {
      // 商品訂單欄位：訂單編號=1, 商品名稱=2, 商品ID=3, 兌換點數=4, 兌換數量=5,
      //           處理狀態=6, 兌換時間=7, 更新狀態時間=8, 取貨館別=9, 取貨廳別=10
      for (const row of rows.slice(1)) {
        const orderId = String(row[1] || '').trim();
        const name = String(row[2] || '').trim();
        const pts  = Number(row[4]) || 0;
        const status = String(row[6] || '').trim();
        const timeVal = row[7];
        if (!name || pts <= 0) continue;
        const dt = parseDate(timeVal);
        if (!dt) continue;

        orderIndexMap.set(name + '|' + timeKey(dt), { orderId, status });
        indexed++;

        if (status === '已取消') {
          const dup = backendCancelledOrders.find(o => o.name === name && Math.abs(o.date - dt) < 60000 && o.pts === pts);
          if (!dup) { backendCancelledOrders.push({ name, date: dt, pts, source: '商品', orderId }); added++; }
        }
      }
      showToast(`✅ 商品訂單已載入（索引 ${indexed} 筆訂單編號，新增 ${added} 筆已取消）`);
    } else {
      showToast('⚠ 無法識別檔案格式，請確認欄位');
      return;
    }

    // 更新 zone 顯示（累積）
    uploadZone2.querySelector('h3').textContent = `✅ 已載入 ${backendCancelledOrders.length} 筆已取消（可繼續上傳）`;
    uploadZone2.classList.add('loaded');

    // 若點數記錄已載入，重新跑分析
    if (fileData) runAnalysis();
  };
  reader.readAsBinaryString(file);
}

// ── Parse ────────────────────────────────────────────────
function parseDate(val) {
  if (!val) return null;
  if (val instanceof Date) return isNaN(val) ? null : val;
  const s = String(val).trim().replace(/\//g, '-');
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

// ── Main analysis ─────────────────────────────────────────
function runAnalysis() {
  if (!fileData) return;
  columnMap = { type: 1, name: 2, points: 5, time: 7, expiry: 8 };

  const rows = fileData.slice(1).map(r => ({
    type:   String(r[columnMap.type] || ''),
    name:   String(r[columnMap.name] || ''),
    points: Number(r[columnMap.points]) || 0,
    time:   parseDate(r[columnMap.time]),
    expiry: parseDate(r[columnMap.expiry]),
  })).filter(r => r.time);

  rows.sort((a, b) => {
    if (a.time - b.time !== 0) return a.time - b.time;
    const order = t => {
      if (t.includes('結清') || t.includes('取消積點')) return 4;
      if (t.includes('兌換退回')) return 3;
      if (t.includes('兌換扣點')) return 2;
      return 1;
    };
    return order(a.type) - order(b.type);
  });

  const pool = [];
  const results = [];
  const toExpStr = dt => dt ? dt.toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'/') : 'N/A';
  const cleanPool = () => { for (let i = pool.length-1; i >= 0; i--) { if (pool[i].rem <= 0) pool.splice(i,1); } };

  for (const row of rows) {
    const pts = row.points;
    const expiry = row.expiry;
    const type = row.type;

    if (pts > 0 && !type.includes('兌換退回')) {
      pool.push({ exp: expiry || new Date(2099,11,31), rem: pts, expStr: toExpStr(expiry) });
      pool.sort((a, b) => a.exp - b.exp);

    } else if (pts > 0 && type.includes('兌換退回')) {
      const refundExp = expiry || new Date(2099,11,31);
      const refundExpStr = toExpStr(expiry);
      const existing = pool.find(e => e.exp.getTime() === refundExp.getTime());
      if (existing) { existing.rem += pts; }
      else { pool.push({ exp: refundExp, rem: pts, expStr: refundExpStr }); pool.sort((a, b) => a.exp - b.exp); }
      results.push({
        date: row.time.toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'/'),
        name: row.name, total: pts, isRefund: true, _time: row.time,
        composition: [{ expStr: refundExpStr, expDt: refundExp, pts }]
      });

    } else if (pts < 0 && type.includes('兌換') && !type.includes('退回')) {
      let needed = Math.abs(pts);
      const composition = [];
      for (const entry of pool) {
        if (needed <= 0) break;
        if (entry.rem <= 0) continue;
        const use = Math.min(entry.rem, needed);
        composition.push({ expStr: entry.expStr, expDt: entry.exp, pts: use });
        entry.rem -= use;
        needed -= use;
      }
      cleanPool();
      const lookupKey = row.name + '|' + timeKey(row.time);
      const vInfo = voucherIndex.get(lookupKey);
      const oInfo = orderIndexMap.get(lookupKey);
      results.push({
        date: row.time.toLocaleDateString('zh-TW', {year:'numeric',month:'2-digit',day:'2-digit'}).replace(/\//g,'/'),
        name: row.name, total: Math.abs(pts), isRefund: false, _time: row.time,
        insufficient: needed > 0, missingPts: needed, composition,
        voucherSerial: vInfo ? vInfo.serial : '', ticketId: vInfo ? vInfo.ticketId : '',
        voucherStatus: vInfo ? vInfo.status : '', useStatus: vInfo ? vInfo.useStatus : '',
        orderId: oInfo ? oInfo.orderId : ''
      });

    } else if (pts < 0) {
      let needed = Math.abs(pts);
      for (const entry of pool) {
        if (needed <= 0) break;
        const use = Math.min(entry.rem, needed);
        entry.rem -= use;
        needed -= use;
      }
      cleanPool();
    }
  }

  // ── 取消配對：先把退回按「商品名稱+日期」合併，再一次配對一筆兌換 ──
  // 原因：一筆取消系統可能拆成多筆退回（如退25+75），若每筆獨立配對會誤標多筆
  for (const r of results) { if (!r.isRefund) r.cancelled = false; }
  const redeemResults = results.filter(r => !r.isRefund);

  // 把所有兌換退回的原始 row 取出，按「商品名稱 + 日期(yyyy-mm-dd)」合併為一組
  const refundRawRows = rows.filter(r => r.type.includes('兌換退回'));
  const refundGroupMap = new Map(); // key: "name|date" -> { name, totalPts, time(最早) }
  for (const r of refundRawRows) {
    const dateKey = r.time ? r.time.toISOString().slice(0, 10) : '';
    const key = r.name + '|' + dateKey;
    if (!refundGroupMap.has(key)) {
      refundGroupMap.set(key, { name: r.name, totalPts: 0, time: r.time });
    }
    refundGroupMap.get(key).totalPts += Math.abs(r.points);
  }
  const mergedRefunds = Array.from(refundGroupMap.values());

  for (const refund of mergedRefunds) {
    // 優先：同名 + 點數相符 + 時間差最小
    let candidates = redeemResults.filter(rd =>
      rd.name === refund.name && !rd.cancelled && rd.total === refund.totalPts
    );
    // fallback：點數不符時只用名稱
    if (candidates.length === 0) {
      candidates = redeemResults.filter(rd =>
        rd.name === refund.name && !rd.cancelled
      );
    }
    if (candidates.length > 0) {
      candidates.sort((a, b) =>
        Math.abs((a._time || 0) - (refund.time || 0)) -
        Math.abs((b._time || 0) - (refund.time || 0))
      );
      candidates[0].cancelled = true;
    }
  }

  // 同步更新 results 裡 isRefund 項目的 cancelled 標記（供 UI 用）
  for (const r of results) {
    if (r.isRefund) {
      // 找對應的 redeemResult，如果它已被標 cancelled 就知道退回有配對到
      const paired = redeemResults.find(rd =>
        rd.name === r.name && rd.cancelled &&
        Math.abs((rd._time || 0) - (r._time || 0)) < 86400000 * 3
      );
      r.pairedCancelled = !!paired;
      if (paired) {
        r.voucherSerial = paired.voucherSerial;
        r.ticketId = paired.ticketId;
        r.orderId = paired.orderId;
      }
    }
  }

  // ── 漏退偵測：後台已取消 但 點數記錄無退回 ────────────
  // 對 backendCancelledOrders 裡每一筆，檢查是否有配對到 cancelled=true 的兌換
  for (const r of results) { r.leaking = false; }

  if (backendCancelledOrders.length > 0) {
    for (const order of backendCancelledOrders) {
      // 必須同時符合：名稱 + 點數 + 時間相近（2天內）
      // 避免同名不同點數的商品（如 995點 vs 199點）互相誤配
      const matched = redeemResults.find(rd => {
        if (rd.name !== order.name) return false;
        if (rd.total !== order.pts) return false;          // ← 新增點數比對
        const diff = Math.abs((rd._time || 0) - order.date);
        return diff < 86400000 * 2; // 2天內
      });
      if (matched && !matched.cancelled) {
        matched.leaking = true;
      }
    }
  }

  analysisData = results;
  renderStats();
  renderResults();
  renderAlertBanner();
  document.getElementById('statsBar').style.display = 'grid';
  document.getElementById('filterBar').style.display = 'flex';
  document.getElementById('resultsWrap').classList.add('show');

  const leakCount = results.filter(r => r.leaking).length;
  if (leakCount > 0) {
    document.getElementById('filterLeaking').style.display = '';
  }
  const redeemCount = results.filter(r => !r.isRefund).length;
  const refundCount = results.filter(r => r.isRefund).length;
  document.getElementById('clearBtn').style.display = '';
  showToast(`✅ 分析完成：兌換 ${redeemCount} 筆、退回 ${refundCount} 筆${leakCount > 0 ? `、⚠ 漏退 ${leakCount} 筆` : ''}`);
}

// ── Alert banner ──────────────────────────────────────────
function renderAlertBanner() {
  const leaking = analysisData.filter(r => r.leaking);
  const banner = document.getElementById('alertBanner');
  if (leaking.length === 0) { banner.classList.remove('show'); return; }

  const rowsHtml = leaking.map(r => {
    const idLabel = r.voucherSerial ? ` ｜ ${r.voucherSerial}` : (r.orderId ? ` ｜ ${r.orderId}` : '');
    return `
    <div class="alert-row">
      <span class="alert-date">${r.date}</span>
      <span class="alert-name">${r.name}${idLabel}</span>
      <span class="alert-pts">-${r.total} 點</span>
    </div>`;
  }).join('');
  const total = leaking.reduce((s, r) => s + r.total, 0);
  document.getElementById('alertRows').innerHTML = rowsHtml;
  document.getElementById('alertTotal').textContent = `合計應補退：${total} 點`;
  banner.classList.add('show');
}

// ── Stats ──────────────────────────────────────────────────
function renderStats() {
  const redeems = analysisData.filter(r => !r.isRefund);
  const total = redeems.length;
  const totalPts = redeems.reduce((s, r) => s + r.total, 0);
  const expiredCount = redeems.filter(r => !r.insufficient && r.composition.some(c => c.expDt < TODAY)).length;
  const leakCount = redeems.filter(r => r.leaking).length;
  document.getElementById('sTotalRedeem').textContent = total;
  document.getElementById('sTotalPts').textContent = totalPts.toLocaleString();
  document.getElementById('sExpiredPts').textContent = expiredCount;
  document.getElementById('sLeaking').textContent = backendCancelledOrders.length > 0 ? leakCount : '—';
}

// ── Filter ─────────────────────────────────────────────────
function setFilter(f) {
  currentFilter = f;
  ['all','expired','valid','completed','cancelled','leaking'].forEach(id => {
    const el = document.getElementById('filter' + id.charAt(0).toUpperCase() + id.slice(1));
    if (el) el.classList.toggle('active', id === f);
  });
  renderResults();
}

// ── Render ─────────────────────────────────────────────────
function renderResults() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  let data = analysisData;
  if (currentFilter === 'expired')   data = data.filter(r => !r.isRefund && !r.insufficient && r.composition.some(c => c.expDt < TODAY));
  if (currentFilter === 'valid')     data = data.filter(r => !r.isRefund && !r.insufficient && r.composition.every(c => c.expDt >= TODAY));
  if (currentFilter === 'completed') data = data.filter(r => !r.isRefund && !r.cancelled);
  if (currentFilter === 'cancelled') data = data.filter(r => r.isRefund || r.cancelled);
  if (currentFilter === 'leaking')   data = data.filter(r => r.leaking);
  if (search) data = data.filter(r => r.name.toLowerCase().includes(search));

  const container = document.getElementById('resultsList');
  if (!data.length) {
    container.innerHTML = '<div class="empty"><div class="icon">🔍</div>找不到符合條件的紀錄</div>';
    return;
  }

  container.innerHTML = data.map(r => {

    // 兌換退回
    if (r.isRefund) {
      const c = r.composition[0];
      const isExpired = c.expDt < TODAY;
      const color = isExpired ? 'var(--danger)' : 'var(--accent)';
      const st = isExpired ? '已過期' : '有效';
      const idTag = r.voucherSerial ? `<span class="id-tag">🎫 ${r.voucherSerial}</span>` : (r.orderId ? `<span class="id-tag">📦 ${r.orderId}</span>` : '');
      return `
        <div class="flat-card" style="border-left-color:${color}">
          <div class="flat-card-header">
            <span class="flat-date">${r.date}</span>
            <span class="flat-label" style="color:var(--text2)">↩ 兌換退回</span>
            ${idTag}
          </div>
          <div class="flat-title" style="color:var(--text2)">${r.name}</div>
          <div class="flat-rows">
            <div class="flat-row">
              <span class="flat-pts" style="color:${color}">+${r.total} 點</span>
              <span class="flat-expiry">效期 ${c.expStr}</span>
              <span class="flat-badge" style="color:${color};background:${isExpired?'rgba(248,113,113,0.1)':'rgba(74,222,128,0.1)'}">${st}</span>
            </div>
          </div>
        </div>`;
    }

    // 資料不足
    if (r.insufficient) {
      const knownRows = r.composition.map(c => {
        const isExpired = c.expDt < TODAY;
        const color = isExpired ? 'var(--danger)' : 'var(--accent)';
        return `<div class="flat-row">
          <span class="flat-pts" style="color:${color}">${c.pts.toLocaleString()} 點</span>
          <span class="flat-expiry">效期 ${c.expStr}</span>
          <span class="flat-badge" style="color:${color};background:${isExpired?'rgba(248,113,113,0.1)':'rgba(74,222,128,0.1)'}">${isExpired?'已過期':'有效'}</span>
        </div>`;
      }).join('');
      const idTagMissing = r.voucherSerial ? `<span class="id-tag">🎫 ${r.voucherSerial}</span>` : (r.orderId ? `<span class="id-tag">📦 ${r.orderId}</span>` : '');
      return `
        <div class="flat-card" style="border-left-color:var(--warn)">
          <div class="flat-card-header"><span class="flat-date">${r.date}</span>${idTagMissing}</div>
          <div class="flat-title">${r.name} <span class="flat-total">點數 ${r.total.toLocaleString()} 點</span></div>
          <div class="flat-rows">
            ${knownRows}
            <div class="flat-row">
              <span class="flat-pts" style="color:var(--warn)">${r.missingPts.toLocaleString()} 點</span>
              <span class="flat-expiry" style="color:var(--text3)">效期不明</span>
              <span class="flat-badge" style="color:var(--warn);background:rgba(251,191,36,0.1)">⚠ 資料不足</span>
            </div>
          </div>
        </div>`;
    }

    // 一般兌換
    const compRows = r.composition.map(c => {
      const isExpired = c.expDt < TODAY;
      const color = isExpired ? 'var(--danger)' : 'var(--accent)';
      return `<div class="flat-row">
        <span class="flat-pts" style="color:${color}">${c.pts.toLocaleString()} 點</span>
        <span class="flat-expiry">效期 ${c.expStr}</span>
        <span class="flat-badge" style="color:${color};background:${isExpired?'rgba(248,113,113,0.1)':'rgba(74,222,128,0.1)'}">${isExpired?'已過期':'有效'}</span>
      </div>`;
    }).join('');

    const hasExpired = r.composition.some(c => c.expDt < TODAY);
    const borderColor = r.leaking ? 'var(--danger)' : (hasExpired ? 'var(--danger)' : 'var(--accent)');
    const leakTag = r.leaking ? `<span class="leaking-tag">⚠ 漏退點數</span>` : '';
    const cancelTag = r.cancelled ? `<span style="font-size:11px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);padding:1px 7px;border-radius:4px;margin-right:6px;font-weight:400">↩ 已取消</span>` : '';
    const idTag = r.voucherSerial ? `<span class="id-tag">🎫 ${r.voucherSerial}</span>` : (r.orderId ? `<span class="id-tag">📦 ${r.orderId}</span>` : '');
    const useTag = r.voucherSerial && r.useStatus ? `<span style="font-size:11px;color:var(--text3)">（${r.useStatus}）</span>` : '';

    return `
      <div class="flat-card${r.leaking ? ' leaking' : ''}" style="border-left-color:${borderColor}">
        <div class="flat-card-header"><span class="flat-date">${r.date}</span>${idTag}</div>
        <div class="flat-title">${leakTag}${cancelTag}${r.name}${useTag} <span class="flat-total">點數 ${r.total.toLocaleString()} 點</span></div>
        <div class="flat-rows">${compRows}</div>
      </div>`;
  }).join('');
}

// ── Export ─────────────────────────────────────────────────
function exportExcel() {
  if (!analysisData.length) return;
  const rows = [['兌換日期','商品名稱','票券序號','訂單編號','兌換點數','效期','使用點數','狀態','備註']];
  for (const r of analysisData) {
    const note = r.leaking ? '漏退點數' : (r.cancelled ? '已取消' : (r.isRefund ? '兌換退回' : ''));
    const serial = r.voucherSerial || '';
    const orderId = r.orderId || '';
    if (r.insufficient) {
      for (const c of r.composition) {
        rows.push([r.date, r.name, serial, orderId, r.total, c.expStr, c.pts, c.expDt < TODAY ? '已過期' : '有效', note]);
      }
      if (r.missingPts > 0) rows.push([r.date, r.name, serial, orderId, r.total, '效期不明', r.missingPts, '歷史資料不足', note]);
    } else {
      for (const c of r.composition) {
        rows.push([r.date, r.name, serial, orderId, r.total, c.expStr, c.pts, c.expDt < TODAY ? '已過期' : '有效', note]);
      }
    }
  }
  // 漏退摘要 sheet
  const leaking = analysisData.filter(r => r.leaking);
  const summaryRows = [['兌換日期','商品名稱','票券序號','訂單編號','應補退點數']];
  for (const r of leaking) summaryRows.push([r.date, r.name, r.voucherSerial || '', r.orderId || '', r.total]);
  if (leaking.length > 0) summaryRows.push(['', '合計', '', '', leaking.reduce((s,r)=>s+r.total,0)]);

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), '兌換效期分析');
  if (leaking.length > 0) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(summaryRows), '漏退點數摘要');
  XLSX.writeFile(wb, `點數兌換效期分析_${new Date().toISOString().slice(0,10)}.xlsx`);
  showToast('✅ Excel 已匯出');
}

function clearAll() {
  // 重置資料
  analysisData = [];
  fileData = null;
  backendCancelledOrders = [];
  voucherIndex = new Map();
  orderIndexMap = new Map();
  currentFilter = 'all';

  // 重置上傳區 1
  uploadZone.querySelector('h3').textContent = '點數紀錄';
  uploadZone.classList.remove('loaded', 'drag-over');
  uploadZone.style.borderColor = '';
  uploadZone.style.background = '';
  document.getElementById('fileInput').value = '';

  // 重置上傳區 2
  uploadZone2.querySelector('h3').textContent = '商品訂單 ＋ 票券紀錄';
  uploadZone2.classList.remove('loaded', 'drag-over');
  document.getElementById('fileInput2').value = '';

  // 隱藏所有結果區
  document.getElementById('statsBar').style.display = 'none';
  document.getElementById('filterBar').style.display = 'none';
  document.getElementById('resultsWrap').classList.remove('show');
  document.getElementById('alertBanner').classList.remove('show');
  document.getElementById('resultsList').innerHTML = '';
  document.getElementById('filterLeaking').style.display = 'none';
  document.getElementById('clearBtn').style.display = 'none';

  // 重置篩選按鈕
  ['all','expired','valid','completed','cancelled','leaking'].forEach(id => {
    const el = document.getElementById('filter' + id.charAt(0).toUpperCase() + id.slice(1));
    if (el) el.classList.toggle('active', id === 'all');
  });

  showToast('🗑 資料已清除');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}
